[project]
name = "sdkgen"
version = "0.1.0"
description = "Generates python/pyftc type database and python/ftc stub modules from FTC SDK sources"
requires-python = ">=3.10"
dependencies = [
    "javalang>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdkgen"]
