<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simulator panel harness</title>
<link rel="stylesheet" href="harness.css">
<style>
  html, body { height: 100%; margin: 0; }
  #harness-bar { height: 26px; display: flex; gap: 6px; align-items: center; padding: 0 8px; font: 12px sans-serif; background: #444; color: #eee; }
  #harness-bar button { font: 12px sans-serif; padding: 1px 8px; }
  #app { height: calc(100% - 26px) !important; }
</style>
</head>
<body class="vscode-dark">
<div id="harness-bar"></div>
<div id="app"></div>
<script src="harness.js"></script>
</body>
</html>
