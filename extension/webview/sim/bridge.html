<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controller bridge</title>
<style>
:root { color-scheme: light dark; --bg: #f4f5f7; --fg: #1d1f23; --dim: #6b7280; --card: #ffffff; --line: #d6d9de; --accent: #1f77d0; }
@media (prefers-color-scheme: dark) { :root { --bg: #17191d; --fg: #e6e7ea; --dim: #9aa0a8; --card: #22252b; --line: #353a42; --accent: #4ea1ff; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
#bridge { max-width: 760px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 0 0 4px; }
.dim { color: var(--dim); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
select { font: inherit; padding: 3px 6px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; max-width: 100%; }
pre { margin: 6px 0 0; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; min-height: 3em; }
.status { font-weight: 600; }
.ok { color: #2ca02c; } .bad { color: #d62728; }
</style>
</head>
<body>
<div id="bridge"></div>
<script src="bridge.js"></script>
</body>
</html>
